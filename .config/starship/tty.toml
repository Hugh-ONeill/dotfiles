"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================
# PLAIN PROMPT FOR THE LINUX CONSOLE
# ============================================================
# Picked by prompt.zsh when TERM=linux: no Nerd Font glyphs, no
# powerline separators, only the console's 16 basic colors.
# Not generated by the theme system, so `theme set` leaves it alone.

add_newline = false

format = """
$username$hostname$directory$jobs$git_branch$git_status$cmd_duration\
$c$rust$golang$nodejs$python$status${custom.updates}
$character"""

[username]
format = '[$user]($style)@'
style_user = 'bold green'
style_root = 'bold red'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'green'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold blue'
read_only = ' ro'
truncation_length = 4
truncation_symbol = '.../'

[jobs]
symbol = 'jobs'
number_threshold = 1
format = '[$symbol $number]($style) '
style = 'yellow'

[git_branch]
format = 'on [$branch]($style) '
style = 'magenta'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = 'red'
ahead = '^${count}'
behind = 'v${count}'
diverged = '^${ahead_count}v${behind_count}'

[cmd_duration]
min_time = 500
format = 'took [$duration]($style) '
style = 'yellow'

[c]
format = '[c$version]($style) '
style = 'cyan'
version_format = '${raw}'

[rust]
format = '[rs $version]($style) '
style = 'red'
version_format = '${raw}'

[golang]
format = '[go $version]($style) '
style = 'cyan'
version_format = '${raw}'

[nodejs]
format = '[node $version]($style) '
style = 'green'
version_format = '${raw}'

[python]
format = '[py $version( $virtualenv)]($style) '
style = 'yellow'
version_format = '${raw}'

[status]
disabled = false
format = '[x $status]($style) '
style = 'bold red'

[custom.updates]
command = "~/.local/bin/checkupdates-cached"
when = "test -f ~/.cache/checkupdates-count && test $(cat ~/.cache/checkupdates-count) -gt 0"
shell = ["bash", "--noprofile", "--norc"]
format = '[upd $output]($style) '
style = 'cyan'

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
vimcmd_symbol = '[<](bold green)'
vimcmd_replace_one_symbol = '[<](bold yellow)'
vimcmd_replace_symbol = '[<](bold yellow)'
vimcmd_visual_symbol = '[<](bold cyan)'
