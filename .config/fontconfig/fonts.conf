<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- prepend Unifont as fallback for all families -->
  <!-- ensures Legacy Computing Supplement (U+1CC00) glyphs render -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Unifont</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Unifont</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Unifont</family>
    </prefer>
  </alias>
</fontconfig>
