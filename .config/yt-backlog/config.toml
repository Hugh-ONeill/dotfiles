# yt-backlog configuration
# Usage: edited by hand; read on every launch of `ytb`

# ============================================================
# COOKIES
# ============================================================

# browser yt-dlp reads YouTube login cookies from
browser = "firefox"
# profile name or path; empty = yt-dlp picks the most recently used one
profile = ""
# firefox container name, if youtube is logged in inside one
container = ""

# ============================================================
# PLAYLISTS
# ============================================================

include_watch_later = true
# playlist ids to skip (LL = liked videos, which are watched by definition)
exclude_playlists = ["LL"]
# playlist ids to sync that are not in your library (e.g. other people's)
extra_playlists = []
# playlists synced more recently than this are skipped (full sync ignores it)
playlist_max_age_hours = 24

# ============================================================
# WATCH TRACKING
# ============================================================

# incremental history sync stops after this many already-known videos in a row
history_stop_after = 200
# fraction of a video played through ytb before it counts as watched
watched_threshold = 0.8

# ============================================================
# PLAYER
# ============================================================

# format mpv asks yt-dlp for. HLS first: youtube 403s ffmpeg on plain https streams
# because it doesn't fetch them in ranged chunks the way yt-dlp does. "" = mpv default
ytdl_format = ""  # laptop: mpv.conf/local.conf decide (local.conf skips AV1)
# extra mpv arguments, e.g. ["--fullscreen"]
mpv_args = []

# ============================================================
# MOBILE
# ============================================================

# folder shared with the phone app (e.g. by Syncthing). every sync imports the
# phone's watch marks from it and writes a fresh snapshot.db.gz. "" = off
mobile_dir = "~/.local/share/yt-backlog/mobile"

# ============================================================
# MORE LIKE THIS
# ============================================================

# ollama server that embeds video text for "more like this" (`ytb similar`)
# 11435 is an ssh tunnel to the desktop's ollama
embed_url = "http://127.0.0.1:11435"
embed_model = "nomic-embed-text"
# how hard a video is pulled toward the playlists it sits in. 0 = text only;
# higher favors playlist-mates over subject
similar_playlist_weight = 0.5

# ============================================================
# SUGGESTIONS
# ============================================================

# `ytb suggest` follows a channel once this many of its videos are in your own
# playlists or your likes
suggest_min_saves = 10
# channels watched at least this often are ones you already keep up with, so
# their uploads are left out (`ytb suggest --left-out` lists them)
suggest_skip_watched_over = 50
# channel names or ids: never suggest from these / follow these whatever the rules say
# e.g. muted_channels = ["David Pakman"]
muted_channels = []
# e.g. follow_channels = ["The Animated Series", "ESOTERICA"]
follow_channels = []
# uploads older than this many days are not suggested
suggest_max_age_days = 30
# shortest video worth suggesting, in minutes
suggest_min_minutes = 2
# most suggestions from one channel, and in total
suggest_per_channel = 2
suggest_count = 100
# ranking: fit to your playlists counts 1.0; these add a little for a channel you
# kept a lot of, and for a newer upload
suggest_weight_channel = 0.1
suggest_weight_fresh = 0.1

# how hard each playlist pulls suggestions toward it, by playlist title.
# unlisted = 1, 0 = ignore, negative = push away anything that resembles it.
# after editing: `ytb suggest --rerank` applies it without re-reading any channel.
# keep this table right above the accounts: toml puts later keys inside it.
[playlist_weights]
# "PoliticalReacTube" = -1

# ============================================================
# ACCOUNTS
# ============================================================

# one block per google account to sync; authuser is the account's
# index in the browser sign-in list (run `ytb accounts` to see them).
# no blocks = just the account youtube currently has selected.
# keep this section last: toml puts later keys inside the block.
#
# [[accounts]]
# name = "main"
# authuser = 0

[[accounts]]
name = "grumpyrumpus"
authuser = 1

[[accounts]]
name = "hugh-j-oneill-4"
authuser = 0
