# vim: set ft=hyprlang :

general {
    lock_cmd = pidof hyprlock || ~/.local/bin/hyprlock-logged
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# Dim screen
listener {
    timeout = 150                                 # 2.5 min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Keyboard backlight (uncomment if you have one)
#listener {
#    timeout = 150                                 # 2.5 min
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#    on-resume = brightnessctl -rd rgb:kbd_backlight
#}

# Warning before lock
listener {
    timeout = 270                                 # 4.5 min
    on-timeout = notify-send -u low "Idle" "Locking in 30 seconds..."
}

# Lock screen
listener {
    timeout = 300                                 # 5 min
    on-timeout = loginctl lock-session
}

# Screen off -- laptop only (DMI chassis_type 8/9/10/14), DISABLED on the
# desktop since 2026-09-01. The eDP panel on the laptop has no DP link retrain
# problem, so it keeps the 5.5 min screen-off.
listener {
    timeout = 330                                 # 5.5 min
    on-timeout = grep -qxE '8|9|10|14' /sys/class/dmi/id/chassis_type && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = grep -qxE '8|9|10|14' /sys/class/dmi/id/chassis_type && hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Desktop:
#
# `dpms off` then `dpms on` renegotiates the DP link while the GPU stays live,
# and on this amdgpu/DP-1 pair that retrain fails: it destroys the wl_output
# global, and every client still holding a reference dies on a Wayland protocol
# error (kitty windows, firefox, awww-daemon, hyprlock itself).
# Measured 2026-09-01: 5 of 6 idle DPMS cycles killed clients, while 4 of 4
# suspend/resume retrains were clean -- resume reinitializes the whole GPU, so
# that path stays safe. The 1800s suspend listener below still powers the
# display down; it just takes 30 min instead of 5.5.
# Re-enable only once the DP link is fixed (cable/port).
#
# listener {
#     timeout = 330                                 # 5.5 min
#     on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
#     on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
# }

# Suspend
listener {
    timeout = 1800                                # 30 min
    on-timeout = systemctl suspend
}
