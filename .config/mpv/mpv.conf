# colors follow the active theme (~/.config/themes/templates/mpv.conf.tmpl)
include="~/.config/themes/current/mpv.conf"

hwdec=auto-safe
vo=gpu
profile=gpu-hq

# prefer HLS for youtube: plain https streams 403 in ffmpeg (no ranged chunking)
ytdl-format=bv*[protocol^=m3u8][height<=?1080]+ba[protocol^=m3u8]/b[protocol^=m3u8][height<=?1080]/bv*+ba/b

# per-machine overrides (gpu choice etc.); missing file just logs a warning
include="~~/local.conf"
