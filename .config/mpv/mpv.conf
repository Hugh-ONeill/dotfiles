# colors follow the active theme (~/.config/themes/templates/mpv.conf.tmpl)
include="~/.config/themes/current/mpv.conf"

hwdec=auto-safe
vo=gpu
profile=gpu-hq

# prefer HLS for youtube: plain https streams 403 in ffmpeg (no ranged chunking)
ytdl-format=bv*[protocol^=m3u8][height<=?1080]+ba[protocol^=m3u8]/b[protocol^=m3u8][height<=?1080]/bv*+ba/b

# per-machine overrides (gpu choice etc.); missing file just logs a warning
include="~~/local.conf"

# ============================================================
# YOUTUBE CAPTIONS
# ============================================================

# youtube 429s caption downloads that come without login cookies
ytdl-raw-options-append=cookies-from-browser=firefox
slang=en,eng

# youtube look for youtube subs only: white on a translucent black box
[youtube]
profile-cond=path and path:find("youtu") ~= nil
profile-restore=copy
sub-font="Noto Sans"
sub-font-size=36
sub-color="#FFFFFFFF"
sub-border-style=background-box
sub-back-color="#BF000000"
sub-outline-size=5
sub-shadow-offset=0
sub-margin-y=36
