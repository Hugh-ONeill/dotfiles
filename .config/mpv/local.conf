# Machine-local mpv settings (laptop: Intel UHD 630 drives eDP-1, Quadro P2000 secondary)
# Usage: pulled in by include= at the end of mpv.conf; not shared via dotfiles

# render on the intel igpu: nvidia's vulkan presenting across PRIME on wayland
# deadlocks the vo when the window is hidden. hwdec decodes on the igpu too
# (vaapi via iHD), so frames never cross PCIe and the quadro can stay idle.
gpu-api=opengl

# neither gpu here decodes AV1 (UHD 630 / Pascal), so youtube's AV1 streams
# fall back to the cpu; take VP9/H.264 instead and keep AV1 as a last resort.
# logged-in (cookie) requests get no HLS, hence the plain-https second branch
ytdl-format=bv*[protocol^=m3u8][height<=?1080][vcodec!^=av01]+ba[protocol^=m3u8]/bv*[height<=?1080][vcodec!^=av01]+ba/bv*[protocol^=m3u8][height<=?1080]+ba[protocol^=m3u8]/b[protocol^=m3u8][height<=?1080]/bv*+ba/b
