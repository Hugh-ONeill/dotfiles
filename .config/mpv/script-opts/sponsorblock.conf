# SponsorBlock options for scripts/sponsorblock.lua
# Usage: read by mpv at startup; B toggles skipping during playback

# comma-separated: sponsor,selfpromo,interaction,intro,outro,preview,filler,music_offtopic
categories=sponsor,selfpromo,interaction
# ignore segments shorter than this many seconds
min_length=1
# add a chapter at each segment so the seekbar and chapter list show them
chapters=yes
