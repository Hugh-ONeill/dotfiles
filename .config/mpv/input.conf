# mpv key bindings
# Usage: read by mpv at startup; only overrides are listed, the rest are mpv's defaults
# seeks and volume go through scripts/feedback.lua, which draws the themed pill, so
# mpv's own OSD bar and text are turned off for them (no-osd)

# ============================================================
# SEEKING
# ============================================================

RIGHT        no-osd seek  5;  script-message-to feedback seek  5
LEFT         no-osd seek -5;  script-message-to feedback seek -5
UP           no-osd seek  60; script-message-to feedback seek  60
DOWN         no-osd seek -60; script-message-to feedback seek -60
Shift+RIGHT  no-osd seek  1 exact; script-message-to feedback seek  1
Shift+LEFT   no-osd seek -1 exact; script-message-to feedback seek -1
Shift+UP     no-osd seek  5 exact; script-message-to feedback seek  5
Shift+DOWN   no-osd seek -5 exact; script-message-to feedback seek -5
Shift+PGUP   no-osd seek  600; script-message-to feedback seek  600
Shift+PGDWN  no-osd seek -600; script-message-to feedback seek -600
WHEEL_RIGHT  no-osd seek  10; script-message-to feedback seek  10
WHEEL_LEFT   no-osd seek -10; script-message-to feedback seek -10
FORWARD      no-osd seek  60; script-message-to feedback seek  60
REWIND       no-osd seek -60; script-message-to feedback seek -60

# ============================================================
# VOLUME
# ============================================================

WHEEL_UP     no-osd add volume  2
WHEEL_DOWN   no-osd add volume -2
0            no-osd add volume  2
9            no-osd add volume -2
*            no-osd add volume  2
/            no-osd add volume -2
KP_MULTIPLY  no-osd add volume  2
KP_DIVIDE    no-osd add volume -2
VOLUME_UP    no-osd add volume  2
VOLUME_DOWN  no-osd add volume -2
m            no-osd cycle mute
MUTE         no-osd cycle mute
